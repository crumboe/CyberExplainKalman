<script>
  Reveal.on("ready", () => {
    Reveal.configure({ scrollActivationWidth: -1 });
    if (Reveal.isScrollView()) {
      Reveal.toggleScrollView(false);
    }

    document.querySelectorAll("[data-bayes-demo]").forEach((demo) => {
      if (demo.dataset.bound === "true") return;
      demo.dataset.bound = "true";

      const get = (role) => demo.querySelector(`[data-role="${role}"]`);
      const state = { box: "A", priorB: 0.5, draws: [] };
      const pct = (value) => `${(value * 100).toFixed(1)}%`;
      const decimal = (value) => value.toFixed(3);

      const renderReset = () => {
        get("box-status").textContent = "A hidden box is ready.";
        get("draw-result").innerHTML = '<span class="result-ball neutral"></span><span><strong>No draws yet</strong><small>Press “Draw a ball” to collect evidence.</small></span>';
        get("history").innerHTML = '<span class="empty-history">None yet</span>';
        get("prior-b").textContent = "50.0%";
        get("prior-a").textContent = "50.0%";
        ["color-one", "color-two"].forEach((role) => get(role).textContent = "result");
        ["like-b", "like-a", "weight-b", "weight-a"].forEach((role) => get(role).textContent = "—");
        get("posterior-b").textContent = "50.0%";
        get("bar-a").style.width = "50%";
        get("bar-b").style.width = "50%";
        get("bar-a").textContent = "Good 50.0%";
        get("bar-b").textContent = "Broken 50.0%";
        get("belief-bar").setAttribute("aria-label", "Current belief: good motor 50 percent, broken motor 50 percent.");
        get("explanation").textContent = "Every draw uses the current posterior as the next prior. Draw repeatedly and watch the estimate respond.";
      };

      const reset = () => {
        state.box = Math.random() < 0.5 ? "A" : "B";
        state.priorB = 0.5;
        state.draws = [];
        renderReset();
      };

      const draw = () => {
        const priorB = state.priorB;
        const priorA = 1 - priorB;
        const redChance = state.box === "B" ? 0.5 : 0.1;
        const color = Math.random() < redChance ? "Red" : "Green";
        const likeB = color === "Red" ? 0.5 : 0.5;
        const likeA = color === "Red" ? 0.1 : 0.9;
        const weightB = priorB * likeB;
        const weightA = priorA * likeA;
        const posteriorB = weightB / (weightB + weightA);
        const posteriorA = 1 - posteriorB;

        state.draws.push(color);
        state.priorB = posteriorB;

        get("draw-result").innerHTML = `<span class="result-ball ${color.toLowerCase()}"></span><span><strong>${color} ball drawn</strong><small>Draw ${state.draws.length} from the same hidden box</small></span>`;
        get("history").innerHTML = "";
        state.draws.forEach((item, index) => {
          const ball = document.createElement("span");
          ball.className = `history-ball ${item.toLowerCase()}`;
          ball.title = `Draw ${index + 1}: ${item}`;
          get("history").appendChild(ball);
        });
        get("prior-b").textContent = pct(priorB);
        get("prior-a").textContent = pct(priorA);
        get("color-one").textContent = color;
        get("color-two").textContent = color;
        get("like-b").textContent = likeB.toFixed(2);
        get("like-a").textContent = likeA.toFixed(2);
        get("weight-b").textContent = `${decimal(priorB)} × ${likeB.toFixed(2)} = ${decimal(weightB)}`;
        get("weight-a").textContent = `${decimal(priorA)} × ${likeA.toFixed(2)} = ${decimal(weightA)}`;
        get("posterior-b").textContent = pct(posteriorB);
        get("bar-a").style.width = pct(posteriorA);
        get("bar-b").style.width = pct(posteriorB);
        get("bar-a").textContent = `Good ${pct(posteriorA)}`;
        get("bar-b").textContent = `Broken ${pct(posteriorB)}`;
        get("belief-bar").setAttribute("aria-label", `Current belief: good motor ${pct(posteriorA)}, broken motor ${pct(posteriorB)}.`);
        get("explanation").textContent = color === "Red"
          ? `Red is more consistent with a broken motor, so belief in “broken” moves from ${pct(priorB)} to ${pct(posteriorB)}.`
          : `Green is more consistent with a good motor, so belief in “broken” moves from ${pct(priorB)} to ${pct(posteriorB)}.`;
      };

      demo.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          if (button.dataset.action === "reset") reset();
          if (button.dataset.action === "draw") draw();
          if (button.dataset.action === "reveal") {
            get("box-status").textContent = state.box === "A" ? "Chosen box: A — good motor" : "Chosen box: B — broken motor";
          }
        });
      });

      reset();
    });

    document.querySelectorAll("[data-kalman-demo]").forEach((demo) => {
      if (demo.dataset.bound === "true") return;
      demo.dataset.bound = "true";

      const get = (role) => demo.querySelector(`[data-role="${role}"]`);
      const state = { truth: 6, estimate: 6, truthVelocity: 0, modelVelocity: 0, driveCommand: 0, tractionBias: 0, posteriorVariance: 0.12, loops: 0 };
      const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
      const approach = (value, target, maxChange) => value + clamp(target - value, -maxChange, maxChange);
      const gaussian = () => {
        const u = Math.max(Number.EPSILON, Math.random());
        const v = Math.max(Number.EPSILON, Math.random());
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      };
      const meters = (value) => `${value.toFixed(2)} m`;
      const speed = (value) => `${(Math.abs(value) < 0.005 ? 0 : value).toFixed(2)} m/s`;
      const position = (value) => `${8 + clamp(value, 0, 10) * 8.7}%`;

      const renderPosition = (role, value) => {
        get(role).style.left = position(value);
        get(role).dataset.overflow = value < 0 ? "← beyond track" : value > 10 ? "beyond track →" : "";
      };

      const tick = () => {
        const gain = Number(get("gain").value);
        const motionSigma = Number(get("motion-noise").value);
        const sensorSigma = Number(get("sensor-noise").value);
        const dt = 0.05;
        const acceleration = 0.8;
        const targetVelocity = state.driveCommand * Number(get("drive-speed").value);
        const modelVelocityBefore = state.modelVelocity;
        state.modelVelocity = approach(state.modelVelocity, targetVelocity, acceleration * dt);
        const accelerationDemand = Math.abs(state.modelVelocity - modelVelocityBefore) / (acceleration * dt || 1);

        // The model assumes ideal traction. The real cart keeps a persistent
        // traction bias while moving, so wheel slip accumulates into visible drift.
        const moving = Math.abs(targetVelocity) > 0.01 || Math.abs(state.truthVelocity) > 0.01;
        if (moving) {
          state.tractionBias = clamp(state.tractionBias + gaussian() * 0.004, -0.65, 0.65);
        }
        const realTargetVelocity = targetVelocity * (1 - motionSigma * clamp(0.32 + state.tractionBias, 0.15, 0.55));
        const realAccelerationLimit = acceleration * dt * clamp(1 - motionSigma * 0.25 + gaussian() * motionSigma * 0.05, 0.3, 1.7);
        state.truthVelocity = approach(state.truthVelocity, realTargetVelocity, realAccelerationLimit);
        state.truth = clamp(state.truth + state.truthVelocity * dt, 0.55, 9.7);
        if (state.truth <= 0.55 || state.truth >= 9.7) state.truthVelocity = 0;

        // With no commanded motion and zero model velocity, the predicted mean
        // stays put. Drive uncertainty widens the belief instead of moving it.
        const prior = state.estimate + state.modelVelocity * dt;
        const measurement = clamp(state.truth + gaussian() * sensorSigma, 0.3, 9.9);
        const innovation = measurement - prior;
        const posterior = prior + gain * innovation;
        const motionVariance = dt * (0.002 + motionSigma * motionSigma * (0.04 + 0.30 * accelerationDemand + 0.18 * Math.abs(state.modelVelocity)));
        const priorVariance = state.posteriorVariance + motionVariance;
        const sensorVariance = sensorSigma * sensorSigma;
        // General covariance update for a manually selected gain.
        state.posteriorVariance = (1 - gain) ** 2 * priorVariance + gain ** 2 * sensorVariance;
        state.estimate = posterior;
        state.loops += 1;

        renderPosition("real-cart", state.truth);
        renderPosition("prior-marker", prior);
        renderPosition("sensor-marker", measurement);
        renderPosition("estimate-marker", posterior);
        get("beam").style.width = `${Math.max(2, state.truth * 8.7)}%`;
        get("truth").textContent = meters(state.truth);
        get("truth-speed").textContent = speed(state.truthVelocity);
        get("prior-value").textContent = meters(prior);
        get("measurement-value").textContent = meters(measurement);
        get("estimate-value").textContent = meters(posterior);
        get("math-prior").textContent = meters(prior);
        get("model-speed").textContent = speed(state.modelVelocity);
        get("math-sensor").textContent = meters(measurement);
        get("innovation").textContent = `${innovation >= 0 ? "+" : ""}${meters(innovation)}`;
        get("equation").textContent = `${prior.toFixed(2)} + ${gain.toFixed(2)} × (${innovation.toFixed(2)}) = ${posterior.toFixed(2)} m`;
        const direction = state.driveCommand < 0 ? "LEFT" : state.driveCommand > 0 ? "RIGHT" : "STOP";
        get("drive-status").textContent = direction === "STOP" ? direction : `${direction} · traction ${Math.round((1 - motionSigma * clamp(0.32 + state.tractionBias, 0.15, 0.55)) * 100)}%`;
        get("footer-model-speed").textContent = speed(state.modelVelocity);
        get("prior-variance").textContent = `${priorVariance.toFixed(3)} m²`;
        get("sensor-variance").textContent = `${sensorVariance.toFixed(3)} m²`;
        get("posterior-variance").textContent = `${state.posteriorVariance.toFixed(3)} m²`;
      };

      const reset = () => {
        state.truth = 6;
        state.estimate = 6;
        state.truthVelocity = 0;
        state.modelVelocity = 0;
        state.driveCommand = 0;
        state.tractionBias = 0;
        state.posteriorVariance = 0.12;
        state.loops = 0;
        demo.querySelectorAll("[data-drive]").forEach((button) => button.classList.remove("is-driving"));
        tick();
      };

      ["drive-speed", "gain", "motion-noise", "sensor-noise"].forEach((role) => {
        get(role).addEventListener("input", () => {
          get("drive-speed-output").textContent = `${Number(get("drive-speed").value).toFixed(2)} m/s`;
          get("gain-output").textContent = Number(get("gain").value).toFixed(2);
          get("motion-output").textContent = Number(get("motion-noise").value).toFixed(2);
          get("sensor-output").textContent = `${Number(get("sensor-noise").value).toFixed(2)} m`;
        });
      });

      const stopDrive = (event) => {
        event?.preventDefault();
        event?.stopPropagation();
        state.driveCommand = 0;
        demo.querySelectorAll("[data-drive]").forEach((button) => button.classList.remove("is-driving"));
      };
      demo.querySelectorAll("[data-drive]").forEach((button) => {
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          button.setPointerCapture?.(event.pointerId);
          if (state.driveCommand === 0) {
            const motionSigma = Number(get("motion-noise").value);
            state.tractionBias = clamp(gaussian() * 0.07, -0.15, 0.2);
          }
          state.driveCommand = Number(button.dataset.drive);
          button.classList.add("is-driving");
        });
        ["pointerup", "pointercancel", "lostpointercapture", "blur"].forEach((name) => button.addEventListener(name, stopDrive));
        button.addEventListener("keydown", (event) => {
          if (![" ", "Enter"].includes(event.key)) return;
          event.preventDefault(); event.stopPropagation();
          state.driveCommand = Number(button.dataset.drive);
          button.classList.add("is-driving");
        });
        button.addEventListener("keyup", (event) => {
          if ([" ", "Enter"].includes(event.key)) stopDrive(event);
        });
        button.addEventListener("click", (event) => { event.preventDefault(); event.stopPropagation(); });
      });
      get("gain").addEventListener("pointerdown", (event) => event.stopPropagation());
      demo.querySelector('[data-action="reset"]').addEventListener("click", (event) => {
        event.stopPropagation();
        reset();
      });

      window.addEventListener("blur", () => stopDrive());
      document.addEventListener("visibilitychange", () => { if (document.hidden) stopDrive(); });
      reset();
      window.setInterval(() => {
        if (document.hidden || !demo.closest("section").classList.contains("present")) { stopDrive(); return; }
        tick();
      }, 50);
    });

    document.querySelectorAll("[data-kalman-fusion-demo]").forEach((demo) => {
      if (demo.dataset.bound === "true") return;
      demo.dataset.bound = "true";

      const get = (role) => demo.querySelector(`[data-role="${role}"]`);
      const state = { truth: 6, estimate: 6, truthVelocity: 0, modelVelocity: 0, driveCommand: 0, tractionBias: 0, loops: 0 };
      const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
      const approach = (value, target, maxChange) => value + clamp(target - value, -maxChange, maxChange);
      const gaussian = () => {
        const u = Math.max(Number.EPSILON, Math.random());
        const v = Math.max(Number.EPSILON, Math.random());
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      };
      const meters = (value) => `${value.toFixed(2)} m`;
      const speed = (value) => `${(Math.abs(value) < 0.005 ? 0 : value).toFixed(2)} m/s`;
      const position = (value) => `${8 + clamp(value, 0, 10) * 8.7}%`;
      const renderPosition = (role, value) => {
        get(role).style.left = position(value);
        get(role).dataset.overflow = value < 0 ? "← beyond track" : value > 10 ? "beyond track →" : "";
      };

      const tick = () => {
        const gain = Number(get("gain").value);
        const motionSigma = Number(get("motion-noise").value);
        const frontSigma = Number(get("front-noise").value);
        const rearSigma = Number(get("rear-noise").value);
        const dt = 0.05;
        const acceleration = 0.8;
        const targetVelocity = state.driveCommand * Number(get("drive-speed").value);
        const modelVelocityBefore = state.modelVelocity;
        state.modelVelocity = approach(state.modelVelocity, targetVelocity, acceleration * dt);
        const accelerationDemand = Math.abs(state.modelVelocity - modelVelocityBefore) / (acceleration * dt || 1);
        const moving = Math.abs(targetVelocity) > 0.01 || Math.abs(state.truthVelocity) > 0.01;
        if (moving) {
          state.tractionBias = clamp(state.tractionBias + gaussian() * 0.004, -0.65, 0.65);
        }
        const realTargetVelocity = targetVelocity * (1 - motionSigma * clamp(0.32 + state.tractionBias, 0.15, 0.55));
        const realAccelerationLimit = acceleration * dt * clamp(1 - motionSigma * 0.25 + gaussian() * motionSigma * 0.05, 0.3, 1.7);
        state.truthVelocity = approach(state.truthVelocity, realTargetVelocity, realAccelerationLimit);
        state.truth = clamp(state.truth + state.truthVelocity * dt, 0.7, 9.3);
        if (state.truth <= 0.7 || state.truth >= 9.3) state.truthVelocity = 0;

        const prior = state.estimate + state.modelVelocity * dt;
        const trueFrontDistance = 10 - state.truth;
        const trueRearDistance = state.truth;
        const frontDistance = clamp(trueFrontDistance + gaussian() * frontSigma, 0.1, 9.9);
        const rearDistance = clamp(trueRearDistance + gaussian() * rearSigma, 0.1, 9.9);
        const frontPosition = 10 - frontDistance;
        const rearPosition = rearDistance;
        const frontVariance = frontSigma * frontSigma;
        const rearVariance = rearSigma * rearSigma;
        const frontPrecision = 1 / frontVariance;
        const rearPrecision = 1 / rearVariance;
        const frontWeight = frontPrecision / (frontPrecision + rearPrecision);
        const rearWeight = 1 - frontWeight;
        const fusedReading = frontWeight * frontPosition + rearWeight * rearPosition;
        const fusedVariance = 1 / (frontPrecision + rearPrecision);
        const innovation = fusedReading - prior;
        const posterior = prior + gain * innovation;
        state.estimate = posterior;
        state.loops += 1;

        renderPosition("real-cart", state.truth);
        renderPosition("prior-marker", prior);
        renderPosition("front-marker", frontPosition);
        renderPosition("rear-marker", rearPosition);
        renderPosition("estimate-marker", posterior);
        get("rear-beam").style.width = `${Math.max(2, state.truth * 8.7)}%`;
        get("front-beam").style.width = `${Math.max(2, (10 - state.truth) * 8.7)}%`;
        get("truth").textContent = meters(state.truth);
        get("truth-speed").textContent = speed(state.truthVelocity);
        get("prior-value").textContent = meters(prior);
        get("front-position").textContent = meters(frontPosition);
        get("rear-position").textContent = meters(rearPosition);
        get("estimate-value").textContent = meters(posterior);
        get("front-distance").textContent = `${meters(frontDistance)} to wall`;
        get("rear-distance").textContent = `${meters(rearDistance)} to wall`;
        get("front-math-position").textContent = meters(frontPosition);
        get("rear-math-position").textContent = meters(rearPosition);
        get("fused-reading").textContent = meters(fusedReading);
        get("equation").textContent = `${prior.toFixed(2)} + ${gain.toFixed(2)} × (${innovation.toFixed(2)}) = ${posterior.toFixed(2)} m`;
        const direction = state.driveCommand < 0 ? "LEFT" : state.driveCommand > 0 ? "RIGHT" : "STOP";
        get("drive-status").textContent = direction === "STOP" ? direction : `${direction} · traction ${Math.round((1 - motionSigma * clamp(0.32 + state.tractionBias, 0.15, 0.55)) * 100)}%`;
        get("model-speed").textContent = speed(state.modelVelocity);
        get("front-weight").textContent = `${Math.round(frontWeight * 100)}%`;
        get("rear-weight").textContent = `${Math.round(rearWeight * 100)}%`;
        get("fused-variance").textContent = `${fusedVariance.toFixed(3)} m²`;
      };

      const reset = () => {
        state.truth = 6;
        state.estimate = 6;
        state.truthVelocity = 0;
        state.modelVelocity = 0;
        state.driveCommand = 0;
        state.tractionBias = 0;
        state.loops = 0;
        demo.querySelectorAll("[data-drive]").forEach((button) => button.classList.remove("is-driving"));
        tick();
      };

      ["drive-speed", "gain", "motion-noise", "front-noise", "rear-noise"].forEach((role) => {
        get(role).addEventListener("input", () => {
          get("drive-speed-output").textContent = `${Number(get("drive-speed").value).toFixed(2)} m/s`;
          get("gain-output").textContent = Number(get("gain").value).toFixed(2);
          get("motion-output").textContent = Number(get("motion-noise").value).toFixed(2);
          get("front-output").textContent = `${Number(get("front-noise").value).toFixed(2)} m`;
          get("rear-output").textContent = `${Number(get("rear-noise").value).toFixed(2)} m`;
        });
      });

      const stopDrive = (event) => {
        event?.preventDefault();
        event?.stopPropagation();
        state.driveCommand = 0;
        demo.querySelectorAll("[data-drive]").forEach((button) => button.classList.remove("is-driving"));
      };
      demo.querySelectorAll("[data-drive]").forEach((button) => {
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          button.setPointerCapture?.(event.pointerId);
          if (state.driveCommand === 0) {
            const motionSigma = Number(get("motion-noise").value);
            state.tractionBias = clamp(gaussian() * 0.07, -0.15, 0.2);
          }
          state.driveCommand = Number(button.dataset.drive);
          button.classList.add("is-driving");
        });
        ["pointerup", "pointercancel", "lostpointercapture", "blur"].forEach((name) => button.addEventListener(name, stopDrive));
        button.addEventListener("keydown", (event) => {
          if (![" ", "Enter"].includes(event.key)) return;
          event.preventDefault(); event.stopPropagation();
          state.driveCommand = Number(button.dataset.drive);
          button.classList.add("is-driving");
        });
        button.addEventListener("keyup", (event) => {
          if ([" ", "Enter"].includes(event.key)) stopDrive(event);
        });
        button.addEventListener("click", (event) => { event.preventDefault(); event.stopPropagation(); });
      });
      demo.querySelector('[data-action="reset"]').addEventListener("click", (event) => {
        event.stopPropagation();
        reset();
      });

      window.addEventListener("blur", () => stopDrive());
      document.addEventListener("visibilitychange", () => { if (document.hidden) stopDrive(); });
      reset();
      window.setInterval(() => {
        if (document.hidden || !demo.closest("section").classList.contains("present")) { stopDrive(); return; }
        tick();
      }, 50);
    });
  });
</script>
